<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Programming — Lectures 1 & 2 (CATC)</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --code-bg: #252526;
      --card-bg: #252526;
      --card-alt: #2d2d30;
      --border: #333333;
      --border-focus: #007acc;
      --text: #d4d4d4;
      --text-bright: #ffffff;
      --text-muted: #858585;
      --accent: #007acc;
      --accent-cyan: #4fc1ff;
      --accent-gold: #dcdcaa;
      --danger: #f48771;
      
      /* VS Code Dark+ Syntax Highlighting Tokens */
      --token-kw: #569cd6;
      --token-var: #9cdcfe;
      --token-num: #b5cea8;
      --token-str: #ce9178;
      --token-com: #6a9955;
      --token-fn: #dcdcaa;
      --token-op: #d4d4d4;
      --token-type: #4ec9b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    /* Widescreen 16:9 Presentation Stage */
    #stage {
      position: relative;
      width: min(96vw, 170.66vh);
      height: min(54vw, 96vh);
      background-color: var(--bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    /* Top Progress Bar */
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 50;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s ease-out;
    }

    /* Slide Deck Container */
    #deck {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Individual Slide */
    .slide {
      position: absolute;
      inset: 0;
      padding: 3rem 4.5rem 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.12s ease-in-out;
      overflow-y: auto;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      z-index: 10;
    }

    /* Discreet Footer */
    .slide-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(8px);
      z-index: 40;
    }

    .slide-counter {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Slide Typography */
    .eyebrow {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-cyan);
      margin-bottom: 0.6rem;
    }

    h1.slide-title {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-bright);
      line-height: 1.2;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }

    h2.slide-subtitle {
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    p.lead {
      font-size: 1.25rem;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    /* Bullets */
    ul.bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--text);
    }

    ul.bullet-list li {
      position: relative;
      padding-left: 1.8rem;
    }

    ul.bullet-list li::before {
      content: "•";
      position: absolute;
      left: 0.4rem;
      color: var(--accent-cyan);
      font-size: 1.4rem;
      line-height: 1.2;
    }

    ul.bullet-list ul {
      list-style: none;
      margin-top: 0.4rem;
      padding-left: 1.5rem;
      font-size: 1rem;
      color: #b0b0b0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    ul.bullet-list ul li::before {
      content: "–";
      position: absolute;
      left: 0.4rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Layout Grids */
    .grid-2col {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 2.5rem;
      align-items: start;
      width: 100%;
    }

    .grid-equal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: stretch;
      width: 100%;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    /* VS Code Code Box */
    .code-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      width: 100%;
    }

    .code-box-header {
      background: #2d2d2d;
      padding: 0.45rem 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333333;
    }

    .code-box-body {
      padding: 1.25rem;
      overflow-x: auto;
      white-space: pre;
    }

    .output-box {
      margin-top: 0.75rem;
      background: #1e1e1e;
      border-top: 1px dashed #3c3c3c;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: #9cdcfe;
    }

    .output-box .out-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Syntax Tokens */
    .token-kw { color: var(--token-kw); font-weight: 500; }
    .token-var { color: var(--token-var); }
    .token-num { color: var(--token-num); }
    .token-str { color: var(--token-str); }
    .token-com { color: var(--token-com); font-style: italic; }
    .token-fn { color: var(--token-fn); }
    .token-op { color: var(--token-op); }
    .token-type { color: var(--token-type); }

    /* Inline Code Pill */
    code.inline-code {
      background: #2d2d2d;
      color: var(--token-var);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
      font-size: 0.95em;
      border: 1px solid #383838;
    }

    /* Controls overlay */
    .nav-hints {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-btn {
      background: #2d2d2d;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #383838;
      color: var(--text-bright);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Progress Indicator -->
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>

    <!-- Slides Container -->
    <div id="deck">
      <!-- Placeholder slide for Task 1 -->
      <section class="slide active" id="slide-1">
        <div class="eyebrow">Civil Aviation Training Center (CATC)</div>
        <h1 class="slide-title">Python Programming</h1>
        <h2 class="slide-subtitle">Lecture 1 &amp; Lecture 2 Course Presentation</h2>
        <p class="lead">Use Arrow Keys (← / →) or Space to navigate. Press <code>F</code> for Fullscreen.</p>
      </section>
    </div>

    <!-- Footer -->
    <div class="slide-footer">
      <div>Civil Aviation Training Center (CATC) • Computer Science</div>
      <div class="nav-hints">
        <button class="nav-btn" onclick="SlideDeck.prev()">◀ Prev</button>
        <button class="nav-btn" onclick="SlideDeck.next()">Next ▶</button>
        <button class="nav-btn" onclick="SlideDeck.toggleFullscreen()">⛶ Fullscreen</button>
        <span id="counter" class="slide-counter">1 / 1</span>
      </div>
    </div>
  </div>

  <script>
    const SlideDeck = (function () {
      let slides = [];
      let currentIndex = 0;
      let counterEl, progressEl;

      function init() {
        slides = Array.from(document.querySelectorAll('.slide'));
        counterEl = document.getElementById('counter');
        progressEl = document.getElementById('progress');

        // Check hash
        const hash = window.location.hash;
        if (hash && hash.startsWith('#slide-')) {
          const idx = parseInt(hash.replace('#slide-', ''), 10) - 1;
          if (!isNaN(idx) && idx >= 0 && idx < slides.length) {
            currentIndex = idx;
          }
        }

        updateView();

        // Keyboard listeners
        window.addEventListener('keydown', handleKeyDown);

        // Hash change listener
        window.addEventListener('hashchange', handleHashChange);

        // Touch swipe support
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          if (touchEndX < touchStartX - 50) next();
          if (touchEndX > touchStartX + 50) prev();
        }, { passive: true });
      }

      function handleKeyDown(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        switch (e.code) {
          case 'ArrowRight':
          case 'Space':
          case 'PageDown':
          case 'Enter':
            e.preventDefault();
            next();
            break;
          case 'ArrowLeft':
          case 'PageUp':
          case 'Backspace':
            e.preventDefault();
            prev();
            break;
          case 'Home':
            e.preventDefault();
            goTo(0);
            break;
          case 'End':
            e.preventDefault();
            goTo(slides.length - 1);
            break;
          case 'KeyF':
            e.preventDefault();
            toggleFullscreen();
            break;
        }
      }

      function handleHashChange() {
        const hash = window.location.hash;
        if (hash && hash.startsWith('#slide-')) {
          const idx = parseInt(hash.replace('#slide-', ''), 10) - 1;
          if (!isNaN(idx) && idx >= 0 && idx < slides.length && idx !== currentIndex) {
            currentIndex = idx;
            updateView();
          }
        }
      }

      function goTo(index) {
        if (index < 0 || index >= slides.length) return;
        currentIndex = index;
        updateView();
        window.location.hash = `slide-${currentIndex + 1}`;
      }

      function next() {
        if (currentIndex < slides.length - 1) {
          goTo(currentIndex + 1);
        }
      }

      function prev() {
        if (currentIndex > 0) {
          goTo(currentIndex - 1);
        }
      }

      function updateView() {
        slides.forEach((slide, idx) => {
          if (idx === currentIndex) {
            slide.classList.add('active');
          } else {
            slide.classList.remove('active');
          }
        });

        if (counterEl) {
          counterEl.textContent = `${currentIndex + 1} / ${slides.length}`;
        }
        if (progressEl) {
          const pct = slides.length > 1 ? ((currentIndex) / (slides.length - 1)) * 100 : 100;
          progressEl.style.width = `${pct}%`;
        }
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      return {
        init,
        next,
        prev,
        goTo,
        toggleFullscreen
      };
    })();

    document.addEventListener('DOMContentLoaded', SlideDeck.init);
  </script>
</body>
</html>
